spring:
  application:
    name: earth-online-backend

  datasource:
    url: jdbc:mysql://localhost:3306/earth_online?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: earth-online-development-secret-key-please-change-123456
  expiration-ms: 86400000

server:
  port: 8080
