spring:
  application:
    name: earth-online-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 45MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/earth_online?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

server:
  port: 8080

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: earth-online-records

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  connect-timeout-seconds: ${DEEPSEEK_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${DEEPSEEK_READ_TIMEOUT_SECONDS:60}

# WebSocket 握手同样要校验浏览器 Origin。部署时配置为实际站点地址，
# 例如 CHAT_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS=http://190.92.245.191,http://localhost:5173
# localhost 与 127.0.0.1 属于不同 Origin，本地测试两个都要保留。
chat:
  websocket:
    allowed-origin-patterns: ${CHAT_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173}
