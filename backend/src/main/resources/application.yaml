spring:
  application:
    name: earth-online-backend

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 45MB

  datasource:
    url: jdbc:mysql://localhost:3306/earth_online?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: earth-online-development-secret-key-please-change-123456
  expiration-ms: 86400000

juhe:
  news:
    base-url: https://v.juhe.cn/toutiao/index
    key: ${JUHE_NEWS_KEY:}
    cache-minutes: 10

gnews:
  base-url: https://gnews.io/api/v4/top-headlines
  key: ${GNEWS_API_KEY:}

server:
  port: 8080

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: earth-online-records

# 临时开启：用于定位上传接口为何返回 403。问题解决后会删除。
logging:
  level:
    org.springframework.security: TRACE
    com.earthonline.backend.auth: DEBUG
