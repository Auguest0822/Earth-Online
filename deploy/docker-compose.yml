services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: earth_online
      MYSQL_USER: earth_online
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ../data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - ../data/minio:/data
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/earth_online?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: earth_online
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${PUBLIC_ORIGIN}
      # 浏览器页面的 Origin 必须在白名单里，否则 WebSocket 握手直接 403，实时聊天不可用。
      # 这里始终把 PUBLIC_ORIGIN 拼进来（不依赖 Compose 的嵌套默认值语法，兼容旧版本），
      # 所以只要 PUBLIC_ORIGIN 填对了，聊天就一定能连上；需要额外来源再设这个变量。
      CHAT_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${CHAT_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-http://localhost:5173},${PUBLIC_ORIGIN}
      # 容器里的 JVM 默认是 UTC，会让聊天和事记时间比北京时间早 8 小时。
      TZ: Asia/Shanghai
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx768m -XX:+UseContainerSupport -Duser.timezone=Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
