server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/earth-online;
    index index.html;
    client_max_body_size 45m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存：发版后浏览器立刻拿到新的入口文件。
    # 其余 /assets/xxx-<hash>.js 之类的文件带哈希，可以长期缓存。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # 流式回答（SSE）：必须关闭缓冲，否则 Nginx 会把整段回答攒起来一次性下发，
    # 前端要等生成结束才看到内容——等于白做流式。只对这一条路径关闭，不影响其他接口。
    location = /api/ai/yearly-memory/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 180s;
        chunked_transfer_encoding on;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }

    location ^~ /earth-online-records/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host minio:9000;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
